<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${formTitle + ' – Dublin Canvas Tracker'}">Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

<div class="main-content">
    <div class="page-header">
        <h1><i class="fa-solid fa-pen-to-square"></i> <span th:text="${formTitle}">Artwork Form</span></h1>
        <a th:href="@{/artworks}" class="btn btn-outline">
            <i class="fa-solid fa-arrow-left"></i> Back to List
        </a>
    </div>

    <form th:action="${submitUrl}" th:object="${artwork}" method="post" class="data-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-section">
            <h3><i class="fa-solid fa-circle-info"></i> Artwork Details</h3>

            <div class="form-group">
                <label for="council">
                    <i class="fa-solid fa-building-columns"></i> Council <span class="required">*</span>
                </label>
                <input type="text" id="council" th:field="*{council}" class="form-control"
                       th:classappend="${#fields.hasErrors('council')} ? 'is-invalid'"
                       placeholder="e.g. Dublin City Council"/>
                <span th:if="${#fields.hasErrors('council')}"
                      th:errors="*{council}" class="error-text"></span>
            </div>

            <div class="form-group">
                <label for="artist">
                    <i class="fa-solid fa-user"></i> Artist <span class="required">*</span>
                </label>
                <input type="text" id="artist" th:field="*{artist}" class="form-control"
                       th:classappend="${#fields.hasErrors('artist')} ? 'is-invalid'"
                       placeholder="e.g. Anna Entrambasaguas"/>
                <span th:if="${#fields.hasErrors('artist')}"
                      th:errors="*{artist}" class="error-text"></span>
            </div>

            <div class="form-group">
                <label for="title">
                    <i class="fa-solid fa-heading"></i> Artwork Title <span class="required">*</span>
                </label>
                <input type="text" id="title" th:field="*{title}" class="form-control"
                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                       placeholder="e.g. Dublin Buzz"/>
                <span th:if="${#fields.hasErrors('title')}"
                      th:errors="*{title}" class="error-text"></span>
            </div>

            <div class="form-group">
                <label for="location">
                    <i class="fa-solid fa-map-marker-alt"></i> Location <span class="required">*</span>
                </label>
                <input type="text" id="location" th:field="*{location}" class="form-control"
                       th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'"
                       placeholder="e.g. Entrance to Tesco, Finglas Rd, Dublin 11"/>
                <span th:if="${#fields.hasErrors('location')}"
                      th:errors="*{location}" class="error-text"></span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="area">
                        <i class="fa-solid fa-map"></i> Area
                    </label>
                    <input type="text" id="area" th:field="*{area}" class="form-control"
                           placeholder="e.g. Northwest"/>
                </div>
                <div class="form-group">
                    <label for="year">
                        <i class="fa-solid fa-calendar"></i> Year
                    </label>
                    <input type="number" id="year" th:field="*{year}" class="form-control"
                           th:classappend="${#fields.hasErrors('year')} ? 'is-invalid'"
                           placeholder="e.g. 2021"/>
                    <span th:if="${#fields.hasErrors('year')}"
                          th:errors="*{year}" class="error-text"></span>
                </div>
                <div class="form-group">
                    <label for="status">
                        <i class="fa-solid fa-circle-dot"></i> Status
                    </label>
                    <select id="status" th:field="*{status}" class="form-control">
                        <option value="">-- Select Status --</option>
                        <option value="1. Remain as is">1. Remain as is</option>
                        <option value="2. Painted Over">2. Painted Over</option>
                        <option value="3. Repaint 2025">3. Repaint 2025</option>
                        <option value="5. Removed">5. Removed</option>
                        <option value="6. Reverted to grey">6. Reverted to grey</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="website">
                    <i class="fa-solid fa-globe"></i> Website Profile
                </label>
                <input type="text" id="website" th:field="*{website}" class="form-control"
                       placeholder="https://www.dublincanvas.com/..."/>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="latitude">
                        <i class="fa-solid fa-location-crosshairs"></i> Latitude
                    </label>
                    <input type="number" id="latitude" th:field="*{latitude}"
                           class="form-control" step="0.000001" placeholder="e.g. 53.384127"/>
                </div>
                <div class="form-group">
                    <label for="longitude">
                        <i class="fa-solid fa-location-crosshairs"></i> Longitude
                    </label>
                    <input type="number" id="longitude" th:field="*{longitude}"
                           class="form-control" step="0.000001" placeholder="e.g. -6.294375"/>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-floppy-disk"></i> Save Artwork
            </button>
            <a th:href="@{/artworks}" class="btn btn-outline">
                <i class="fa-solid fa-xmark"></i> Cancel
            </a>
        </div>
    </form>
</div>
</body>
</html>
